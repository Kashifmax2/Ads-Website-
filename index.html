<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechSarthi — Sponsored Page</title>
  <meta name="description" content="Sponsored page.">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">T</span>
        <span class="brand-text">TechSarthi<small>Sponsored page</small></span>
      </a>
      <div class="header-right">
        <span class="badge">Ad-supported</span>
        <a class="header-cta" href="privacy.html">Privacy</a>
      </div>
    </div>
  </header>

  <main class="wrap ad-page">

    <!-- TOP LEADERBOARD -->
    <aside class="ad-slot top-slot" data-slot="top-banner" data-size="leaderboard" aria-label="Advertisement"></aside>

    <div class="ad-wall">

      <!-- ================= LEFT RAIL ================= -->
      <div class="rail rail-left">
        <div class="ad-slot" data-slot="left-1" data-size="skyscraper" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="left-2" data-size="sky-short" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="left-3" data-size="skyscraper" aria-label="Advertisement"></div>
      </div>

      <!-- ================= CENTER COLUMN ================= -->
      <div class="center">
        <div class="ad-slot" data-slot="center-1" data-size="billboard" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-2" data-size="rectangle" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-3" data-size="rectangle" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-4" data-size="native" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-5" data-size="billboard" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-6" data-size="rectangle" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-7" data-size="rectangle" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="center-8" data-size="native" aria-label="Advertisement"></div>
      </div>

      <!-- ================= RIGHT RAIL ================= -->
      <div class="rail rail-right">
        <div class="ad-slot" data-slot="right-1" data-size="skyscraper" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="right-2" data-size="sky-short" aria-label="Advertisement"></div>
        <div class="ad-slot" data-slot="right-3" data-size="skyscraper" aria-label="Advertisement"></div>
      </div>

    </div>

    <!-- BOTTOM LEADERBOARD -->
    <aside class="ad-slot bottom-slot" data-slot="bottom-banner" data-size="leaderboard" aria-label="Advertisement"></aside>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer slim">
    <div class="wrap footer-row">
      <p>© <span id="year">2026</span> TechSarthi. All rights reserved.</p>
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </footer>

  <!-- ================= STICKY ANCHOR AD ================= -->
  <div class="anchor-ad" id="anchor-ad" hidden>
    <button class="anchor-close" id="anchor-close" type="button" aria-label="Close advertisement">×</button>
    <aside class="ad-slot ad-slot-anchor" data-slot="anchor" data-size="anchor" aria-label="Advertisement"></aside>
  </div>

  <!-- ================= HIDDEN / SCRIPT-ONLY SLOTS ================= -->
  <!-- Vignette / interstitial: the network code builds its own overlay -->
  <div class="ad-slot ad-slot-hidden" data-slot="vignette" data-size="vignette" aria-hidden="true"></div>

  <!-- Popunder / pop ads -->
  <div class="ad-slot ad-slot-hidden" data-slot="pop" data-size="script" aria-hidden="true"></div>

  <!-- Social bar -->
  <div class="ad-slot ad-slot-hidden" data-slot="social-bar" data-size="script" aria-hidden="true"></div>

  <!-- Any other script-only network -->
  <div class="ad-slot ad-slot-hidden" data-slot="global-scripts" data-size="script" aria-hidden="true"></div>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">↑</button>

  <script src="ads.js"></script>
  <script src="app.js"></script>
</body>
</html>
